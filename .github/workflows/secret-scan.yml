name: secret-scan
# Reusable Betterleaks secret scan (tommyli/ai-agents docs/secrets-detection, spec R16, R17).
# Push / pull_request: scans the pushed or PR range. schedule / workflow_dispatch: full history.
# Rule set: the caller's own .betterleaks.toml or .gitleaks.toml when it has one; otherwise the
# personal rule set below, a copy of tommyli/ai-agents config/betterleaks.toml (keep them in step).
# Validation is off: nothing is sent to provider APIs. Never add -v (in Betterleaks v2 it validates).
# org-denylist (optional): the text of a second Betterleaks rule file, usually from an organisation variable. When
# given, the same range is scanned with it, unredacted, and the range's commit messages are matched against its rules
# that have no allowlist (tommyli/ai-agents docs/org-isolation, R6-ci-org-denylist-input). This file names no term.
on:
  workflow_call:
    inputs:
      full-history:
        type: boolean
        default: false
      org-denylist:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  betterleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BL_VERSION: "1.9.0"
      BL_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7  # betterleaks_1.9.0_linux_x64.tar.gz, checksums.txt 2026-10-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install betterleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bl.tgz" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}/betterleaks_${BL_VERSION}_linux_x64.tar.gz"
          echo "${BL_SHA256}  $RUNNER_TEMP/bl.tgz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/bl.tgz" -C /usr/local/bin betterleaks
          betterleaks version
      - name: Choose rule set
        id: config
        run: |
          if   [ -f .betterleaks.toml ]; then echo "path=.betterleaks.toml" >> "$GITHUB_OUTPUT"
          elif [ -f .gitleaks.toml ];    then echo "path=.gitleaks.toml" >> "$GITHUB_OUTPUT"
          else
            cat > "$RUNNER_TEMP/betterleaks.toml" <<'TOML'
          # Personal Betterleaks rule set (v1 syntax). Used by git-hooks/secrets-scan only when a
          # repository has no .betterleaks.toml or .gitleaks.toml of its own (spec R4).
          # Installed copy: ~/.config/betterleaks/betterleaks.toml
          #
          # Extends the built-in default rules. The default prefilter already skips node_modules,
          # vendor, lockfiles and binaries, so this file only adds rules the default lacks.
          # Port to v2 syntax before unpinning betterleaks (plan step 18).
          
          title = "personal betterleaks config"
          
          [extend]
          useDefault = true
          
          # Infisical service token: `st.${serviceToken.id}.${secret}`, id a UUID, secret
          # crypto.randomBytes(16).toString("hex") (Infisical backend
          # service-token-service.ts and the 20231225072545 migration, read 2026-10-10).
          [[rules]]
          id = "infisical-service-token"
          description = "Infisical service token"
          regex = '''\bst\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.[0-9a-f]{32}\b'''
          keywords = ["st."]
          
          # Tariff Grammar documents (fire-energy energy-data-platform) carry `lineage_key = "<slug>"`,
          # an identifier that the generic-api-key rule flags when the slug is long. Not a credential.
          [[allowlists]]
          description = "Tariff Grammar lineage_key identifiers"
          targetRules = ["generic-api-key"]
          regexTarget = "line"
          regexes = ['''^\s*lineage_key\s*=\s*"[a-z0-9_]+"\s*$''']
          TOML
            echo "path=$RUNNER_TEMP/betterleaks.toml" >> "$GITHUB_OUTPUT"
          fi
      - name: Work out commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full-history }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          opts="--all"
          if [ "$FULL" != "true" ]; then
            if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; head="$PR_HEAD"
            elif [ "$EVENT" = "push" ]; then base="$BEFORE"; head="$AFTER"; fi
            # betterleaks exits 0 on an unreadable range, so an unknown base falls back to full history
            if [ -n "${base:-}" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              opts="${base}..${head}"
            fi
          fi
          echo "Scanning: $opts"
          echo "log_opts=$opts" >> "$GITHUB_OUTPUT"
      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
          CONFIG: ${{ steps.config.outputs.path }}
        run: |
          set +e
          betterleaks git . --log-opts="$LOG_OPTS" --config "$CONFIG" --no-banner --redact \
            --report-format csv --report-path "$RUNNER_TEMP/findings.csv"
          rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error::Secret detected (values redacted). Rotate it if real; mark a false positive with betterleaks:allow."
            awk -F, 'NR > 1 { printf "  %s  %s:%s  (%s)\n", $1, $3, $7, substr($2, 1, 12) }' "$RUNNER_TEMP/findings.csv"
          fi
          exit "$rc"
      - name: Organisation scan
        if: ${{ !cancelled() && inputs.org-denylist != '' }}
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
          DENYLIST: ${{ inputs.org-denylist }}
        run: |
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/org-denylist.toml"
          set +e
          # Findings exit 42, so any other non-zero exit is a scanner failure, not a clean range.
          betterleaks git . --log-opts="$LOG_OPTS" --config "$RUNNER_TEMP/org-denylist.toml" --no-banner \
            --exit-code 42 --report-format json --report-path "$RUNNER_TEMP/org-findings.json"
          rc=$?
          set -e
          case $rc in 0 | 42) ;; *) echo "::error::betterleaks failed (exit $rc)"; exit "$rc" ;; esac
          # Messages have no path, so only the rules without an allowlist apply to them. The same logic as
          # tommyli/ai-agents git-hooks/org-terms, which this public workflow cannot call; keep the two in step. -W error: a Go-only regex
          # construct Python would read differently (a POSIX class) fails the step instead of matching nothing.
          # shellcheck disable=SC2086 # LOG_OPTS is a range or --all
          git log --format='%H%x00%B%x1e' $LOG_OPTS > "$RUNNER_TEMP/messages"
          python3 -I -W error::FutureWarning - "$RUNNER_TEMP/org-denylist.toml" "$RUNNER_TEMP/org-findings.json" "$RUNNER_TEMP/messages" "$rc" <<'PY'
          import json, re, sys, tomllib
          denylist, findings, messages, rc = sys.argv[1:5]
          rules = [r for r in tomllib.load(open(denylist, "rb"))["rules"] if not r.get("allowlists")]
          hits = []
          if rc == "42":  # the report must exist; a missing one raises and fails the step
              for f in json.load(open(findings)):
                  hits.append("%s %s:%s (%s) \"%s\"" % (f["RuleID"], f["File"], f["StartLine"], f["Commit"][:12], f["Match"]))
          commit = ""
          for rec in open(messages, encoding="utf-8", errors="replace").read().split("\x1e"):
              # A record without a commit is message text that itself held \x1e: it belongs to the previous commit.
              if "\x00" in rec:
                  commit, text = rec.lstrip("\n").split("\x00", 1)
              else:
                  text = rec
              for r in rules:
                  hits += ["%s message (%s) \"%s\"" % (r["id"], commit[:12], m.group(0)) for m in re.finditer(r["regex"], text)]
          if hits:
              print("::error::Another organisation's term. Reword it; a public-market-data false positive takes a betterleaks:allow comment or a .betterleaksignore fingerprint.")
              print("\n".join("  " + h for h in hits))
              sys.exit(1)
          PY
